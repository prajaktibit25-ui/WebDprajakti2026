<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Practical Grade Calculator</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500
             flex items-center justify-center p-5">

  <!-- Main Card -->
  <div class="w-full max-w-lg bg-white rounded-3xl shadow-2xl p-8">

    <!-- Heading -->
    <div class="text-center mb-7">
      <div class="text-5xl mb-2">🎓</div>

      <h1 class="text-3xl font-extrabold text-gray-800">
        Practical <span class="text-indigo-600">Grade</span> Calculator
      </h1>

      <p class="text-gray-500 mt-2">
        Calculate your practical performance instantly
      </p>
    </div>

    <!-- Student Name -->
    <div class="mb-5">
      <label class="block text-sm font-semibold text-gray-600 mb-2">
        👤 Student Name
      </label>

      <input
        type="text"
        id="studentName"
        placeholder="Enter your name"
        class="w-full p-3 rounded-xl border border-gray-200
               focus:outline-none focus:ring-2 focus:ring-indigo-500"
      >
    </div>

    <!-- Practical Inputs -->
    <div class="space-y-4">

      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-2">
          🧪 DS Lab Practical 
        </label>

        <input
          type="number"
          id="p1"
          min="0"
          max="100"
          placeholder="Enter marks out of 100"
          class="marks w-full p-3 rounded-xl border border-gray-200
                 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-2">
          🔬 OOPS Lab Practical 
        </label>

        <input
          type="number"
          id="p2"
          min="0"
          max="100"
          placeholder="Enter marks out of 100"
          class="marks w-full p-3 rounded-xl border border-gray-200
                 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-2">
          🎤 Viva / Oral Exam
        </label>

        <input
          type="number"
          id="p3"
          min="0"
          max="100"
          placeholder="Enter marks out of 100"
          class="marks w-full p-3 rounded-xl border border-gray-200
                 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
      </div>

    </div>

    <!-- Calculate Button -->
    <button
      onclick="calculateGrade()"
      class="w-full mt-6 py-3 rounded-xl
             bg-gradient-to-r from-indigo-600 to-purple-600
             text-white font-bold text-lg
             hover:scale-[1.02] transition duration-200
             shadow-lg"
    >
      ✨ Calculate Result
    </button>

    <!-- Result -->
    <div id="result" class="hidden mt-7">

      <div class="rounded-2xl bg-gradient-to-r from-indigo-50 to-purple-50
                  p-6 border border-indigo-100">

        <h2 class="text-xl font-bold text-center text-gray-800 mb-5">
          📊 Result Card
        </h2>

        <div class="text-center mb-5">
          <p class="text-sm text-gray-500">Student</p>

          <p id="displayName"
             class="text-xl font-bold text-indigo-600">
          </p>
        </div>

        <!-- Result Stats -->
        <div class="grid grid-cols-2 gap-4">

          <div class="bg-white rounded-xl p-4 text-center shadow-sm">
            <p class="text-sm text-gray-500">
              Total Marks
            </p>

            <p id="total"
               class="text-2xl font-bold text-gray-800">
            </p>
          </div>

          <div class="bg-white rounded-xl p-4 text-center shadow-sm">
            <p class="text-sm text-gray-500">
              Percentage
            </p>

            <p id="percentage"
               class="text-2xl font-bold text-indigo-600">
            </p>
          </div>

        </div>

        <!-- Grade -->
        <div class="text-center mt-5">

          <p class="text-gray-500">
            Final Grade
          </p>

          <div
            id="grade"
            class="inline-flex items-center justify-center
                   w-20 h-20 mt-2 rounded-full
                   bg-indigo-600 text-white
                   text-2xl font-extrabold shadow-lg"
          >
          </div>

          <p id="status" class="font-bold mt-3"></p>

        </div>

      </div>

    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-gray-400 mt-6">
      HTML • Tailwind CSS • JavaScript
    </p>

  </div>


  <script>

    function calculateGrade() {

      const ids = ["p1", "p2", "p3"];

      let marks = [];

      // Student name
      let name = document.getElementById("studentName").value.trim();

      if (name === "") {
        alert("Please enter student name.");
        return;
      }

      // Validate marks
      for (let id of ids) {

        let val = document.getElementById(id).value;

        if (
          val === "" ||
          isNaN(val) ||
          Number(val) < 0 ||
          Number(val) > 100
        ) {
          alert("Please enter valid marks (0-100) in all fields.");
          return;
        }

        marks.push(Number(val));
      }

      // Calculate total
      const total = marks.reduce(
        (sum, m) => sum + m, 0
      );

      // Maximum marks
      const maxTotal = marks.length * 100;

      // Calculate percentage
      const percentage =
        (total / maxTotal) * 100;

      // Calculate grade
      let grade;

      if (percentage >= 90)
        grade = "A+";

      else if (percentage >= 80)
        grade = "A";

      else if (percentage >= 70)
        grade = "B";

      else if (percentage >= 60)
        grade = "C";

      else if (percentage >= 50)
        grade = "D";

      else if (percentage >= 40)
        grade = "E";

      else
        grade = "F";

      // Display result
      document.getElementById("displayName").innerText = name;

      document.getElementById("total").innerText =
        `${total} / ${maxTotal}`;

      document.getElementById("percentage").innerText =
        `${percentage.toFixed(2)}%`;

      document.getElementById("grade").innerText = grade;

      // Pass / Fail
      const status = document.getElementById("status");

      if (percentage >= 40) {

        status.innerText =
          "🎉 Congratulations! You Passed!";

        status.className =
          "font-bold mt-3 text-green-600";

      } else {

        status.innerText =
          "📚 Keep Practicing!";

        status.className =
          "font-bold mt-3 text-red-500";
      }

      // Show result
      document
        .getElementById("result")
        .classList.remove("hidden");
    }

  </script>

</body>
</html>
